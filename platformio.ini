; ModBusBLUpdater
;
; A throw-away application that replaces the ModBusBL bootloader in the field.
; Upload it through the PLC like any other app (the .hex from .pio/build/updater/).
; On boot it rewrites 0x7800-0x7FFF with the bootloader image baked in at build
; time, clears APP_VALID and resets. The new bootloader then waits for the real
; application to be uploaded again. The slave ID in EEPROM is kept.
;
; Build the bootloader project first; gen_bl_image.py embeds its firmware.hex.

[env:updater]
platform  = atmelavr
board     = nanoatmega328
; No framework — pure avr-gcc / avr-libc.

custom_bl_hex = ../ModBusBootlader/.pio/build/bootloader/firmware.hex

extra_scripts = pre:gen_bl_image.py

build_flags =
    -DF_CPU=16000000L
    -DMBBP_DIR_PIN=4
    -DMBBP_LED_PIN=13
    -I../ModBussLibrary_BL/src
    -Os

lib_deps     =
lib_ldf_mode = off
